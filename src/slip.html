<!--
  SPDX-License-Identifier: CC0-1.0

  One kneeboard slip. This is the single source of truth for the form —
  tools/build.py stamps it out three times per page, two pages (front/back).

  The <!-- REPEAT:WP --> ... <!-- /REPEAT:WP --> block is emitted once per
  waypoint (count set in tools/build.py).
-->
<section class="slip">

  <!-- Clamp zone, laid out around the clamp's wire handle rather than under
       it. The handle is a flat loop lying on the sheet: an upper bar along the
       top edge, a lower bar 15.5-20 mm down, and two side rails joining them
       at roughly 14-20 mm and 77-81 mm from the left edge.

       So the header is three columns. FROM / TO / RWY go in the middle, seen
       through the loop's open window; A/C and DATE go in the strips outside
       the rails, which no part of the handle ever crosses. The strip below
       the content is left blank because that is where the lower bar lands.

       Nothing here is meant to be written or read in flight. -->
  <div class="clamp">
    <div class="hdr">
      <div class="col side">
        <span class="lab">A/C</span>
        <span class="box"></span>
      </div>

      <div class="col mid">
        <div class="rte">
          <span class="lab from">FROM</span><span class="box icao"></span>
          <span class="hint">RWY</span><span class="box rwy"></span>
        </div>
        <div class="rte">
          <span class="lab from">TO</span><span class="box icao"></span>
          <span class="hint">RWY</span><span class="box rwy"></span>
        </div>
      </div>

      <div class="col side">
        <span class="lab">DATE</span>
        <span class="box"></span>
      </div>
    </div>

    <!-- Bottom right of the blank strip: outside the right-hand rail, so the
         handle never covers it. VARIANT is stamped in by tools/build.py, so a
         slip that has been cut off the sheet still says which grid it carries. -->
    <span class="topmark">&#9650; TOP VARIANT</span>
  </div>

  <!-- First block clear of the clamp: the values you actually write in the
       cockpit. QNH is the last two digits; the circle takes the ATIS letter. -->
  <div class="info">
    <div class="row">
      <span class="lab">T/O</span><span class="box time"></span>
      <span class="lab">LDG</span><span class="box time"></span>
    </div>
    <div class="qnh">
      <span class="hint">QNH / INFO</span>
      <span class="grp">
        <span class="lab">DEP</span><span class="lab">Q</span>
        <span class="box q"></span><span class="circ"></span>
      </span>
      <span class="grp">
        <span class="lab">DEST</span><span class="lab">Q</span>
        <span class="box q"></span><span class="circ"></span>
      </span>
    </div>
  </div>

  <!-- Frequencies first, then free text: en-route FIS, fuel and mass, squawk,
       a clearance. This block also absorbs any leftover slip height. -->
  <div class="freqs">
    <div class="frow">
      <span class="lab">DEP</span><span class="fill"></span>
      <span class="lab">DEST</span><span class="fill"></span>
    </div>
    <div class="fline"></div>
    <div class="fline"></div>
    <div class="fline"></div>
    <div class="fline"></div>
  </div>

  <table class="nav">
    <colgroup>
      <col class="c-class" /><col class="c-alt" /><col class="c-palt" />
      <col class="c-crs" /><col class="c-gs" /><col class="c-time" />
      <col class="c-fuel" /><col class="c-eto" />
    </colgroup>
    <thead>
      <tr>
        <th rowspan="2">CL</th>
        <th class="sp">MAX ALT</th>
        <th rowspan="2">ALT</th>
        <th class="sp">MC</th>
        <th class="sp">GS</th>
        <th class="sp">LEG</th>
        <th class="sp">MIN FUEL</th>
        <th class="sp">ETO</th>
      </tr>
      <tr>
        <th class="sp2">MIN ALT</th>
        <th class="sp2">MH</th>
        <th class="sp2">DIST</th>
        <th class="sp2">TOTAL</th>
        <th class="sp2">ACT. FUEL</th>
        <th class="sp2">ATO</th>
      </tr>
    </thead>
    <tbody>
<!-- REPEAT:WP -->
      <tr class="wp">
        <td class="name" colspan="6"><span class="hint">WAYPOINT</span></td>
        <td class="wv" colspan="2"><span class="hint">W/V</span></td>
      </tr>
      <tr class="data upper">
        <td class="cls"></td><td></td><td class="span" rowspan="2"></td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
      <tr class="data lower">
        <td class="cls"></td><td></td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
<!-- /REPEAT:WP -->
      <!-- The destination: a name and the landing wind, but no data rows —
           the figures under a waypoint describe the leg departing it, and
           nothing departs the last one. Row 33 of the v1 sheet did the same. -->
      <tr class="wp last">
        <td class="name" colspan="6"><span class="hint">WAYPOINT</span></td>
        <td class="wv" colspan="2"><span class="hint">W/V</span></td>
      </tr>
    </tbody>
  </table>

</section>
